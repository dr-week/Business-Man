# wrangler configuration for deploying Cloudflare Workers
# Place this file in the project root.
# Ensure you have Cloudflare account and install @cloudflare/wrangler.
# Run: npm install -g @cloudflare/wrangler
# Then: wrangler login
# Then: wrangler publish

name = "businessman-market-research"
type = "javascript"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
workers_dev = true
compatibility_date = "2024-01-01"

# KV namespace binding
kv_namespaces = [{ binding = "MARKET_RESEARCH", id = "<YOUR_KV_NAMESPACE_ID>" }]

# Route configuration (optional if using a custom domain)
# routes = [{ pattern = "https://api.yourdomain.com/market-research", script = "market-research-worker" }]

# You can also set environment variables, secrets, etc.
